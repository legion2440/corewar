name: CI

on:
  push:
    branches: [main, implementation/corewar]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Python validator dependency
        run: python3 -m pip install --user jsonschema
      - name: Full audit
        run: make audit
