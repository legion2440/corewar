name: Visualizer bootstrap

on:
  push:
    branches: [feature/ebitengine-visualizer]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ebitengine-visualizer
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Tidy format and verify
        run: |
          cd vm/visualizer
          go mod tidy
          gofmt -w .
          go test ./...
          go vet ./...
          go build -o /tmp/corewar-visual .
      - name: Commit generated module metadata
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vm/visualizer
          git commit -m "chore(visualizer): tidy module and format sources"
          git push origin HEAD:feature/ebitengine-visualizer
