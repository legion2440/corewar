name: CI

on:
  push:
    branches: [main, implementation/corewar, feature/ebitengine-visualizer]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Python validator dependency
        run: python3 -m pip install --user jsonschema
      - name: Static checks
        run: |
          cargo fmt --manifest-path assembler/Cargo.toml -- --check
          cargo clippy --manifest-path assembler/Cargo.toml --all-targets -- -D warnings
          test -z "$(gofmt -l vm)"
          cd vm && go vet ./...
      - name: Full audit
        run: make audit

  visualizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Verify module
        working-directory: vm/visualizer
        run: |
          go mod verify
          test -z "$(find . -name '*.go' -print0 | xargs -0 gofmt -l)"
          go vet ./...
          go test ./...
          go build -o /tmp/corewar-visual .
